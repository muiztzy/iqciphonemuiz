<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYHARD - AM PREMIUM TOOLS</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#000;color:#fff;font-family:'Courier New',monospace;padding:16px}
  .wrap{max-width:680px;margin:auto}
  .header{text-align:center;padding:18px 10px 8px}
  .logo{font-size:32px;font-weight:900;letter-spacing:2px;color:#00ff41;text-shadow:0 0 18px #00ff41,0 0 35px #00ff41}
  .sub{font-size:12px;letter-spacing:4px;color:#aaa;margin-top:4px}
  .badge{display:inline-block;margin-top:10px;background:#00ff41;color:#000;font-weight:900;font-size:11px;padding:5px 12px;border-radius:999px}
  .card{background:#0d0d0d;border:1px solid #1f3d26;border-radius:18px;padding:16px;margin-top:16px;box-shadow:0 0 25px rgba(0,255,65,.15)}
  .title{font-size:14px;color:#00ff41;font-weight:700;margin-bottom:12px}
  .row{display:flex;gap:8px;align-items:center;background:#000;border:1px solid #222;border-radius:12px;padding:10px;margin-bottom:8px}
  .num{width:26px;height:26px;flex-shrink:0;background:#1a1a1a;color:#00ff41;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .code{flex:1;font-size:12px;line-height:1.5;word-break:break-all;color:#eaffea;overflow:hidden}
  .btn{flex-shrink:0;background:#00ff41;color:#000;border:0;border-radius:9px;padding:8px 10px;font-weight:800;font-size:11px;cursor:pointer}
  .btn:active{transform:scale(.95)}
  .btn.done{background:#fff}
  .big{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;background:#00ff41;color:#000;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 0 20px rgba(0,255,65,.4)}
  .note{text-align:center;color:#888;font-size:11px;margin-top:12px;line-height:1.6}
  .note a{color:#00ff41;text-decoration:none}
  .footer{text-align:center;color:#555;font-size:10px;margin-top:18px;letter-spacing:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">PLAYHARD</div>
    <div class="sub">VUСK • MAGETAN • JATIM</div>
    <div class="badge">AM PREMIUM TOOLS</div>
  </div>

  <div class="card">
    <div class="title">> TERMINAL - TERMUX SETUP</div>
    <div id="list"></div>
    <button class="big" onclick="copyAll()">📋 SALIN KABEH SEKALIGUS</button>
    <div class="note" id="status">Klik COPY neng saben baris / tombol gede neng nduwur</div>
    <div class="note">Repo: <a href="https://github.com/ApinMD/am-premium-tools">github.com/ApinMD/am-premium-tools</a></div>
  </div>
  <div class="footer">PLAYHARD NEVER DIE • GASPOL TERUS</div>
</div>

<script>
const cmds = [
  "pkg update -y && pkg upgrade -y",
  "termux-setup-storage",
  "termux-change-repo",
  "pkg install git -y",
  "pkg install pip -y",
  "pkg install python -y",
  "pip install textual questionary rich requests",
  "git clone https://github.com/ApinMD/am-premium-tools.git",
  "cd am-premium-tools",
  "python ampremium.py"
];
const list = document.getElementById('list');
cmds.forEach((c,i)=>{
  const div = document.createElement('div');
  div.className='row';
  div.innerHTML = `<div class="num">${i+1}</div><div class="code">${c}</div><button class="btn" onclick="copyOne(this,'${c.replace(/'/g,"\\'")}')">COPY</button>`;
  list.appendChild(div);
});
function copyText(t, btn){
  navigator.clipboard.writeText(t).then(()=>{
    document.getElementById('status').innerText = '✅ Wes ke-copy: ' + t;
    if(btn){ btn.innerText='DONE ✓'; btn.classList.add('done'); setTimeout(()=>{btn.innerText='COPY'; btn.classList.remove('done')},1500); }
  }).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    document.getElementById('status').innerText='✅ Wes ke-copy!';
  });
}
function copyOne(btn, txt){ copyText(txt, btn); }
function copyAll(){ copyText(cmds.join('\n'), null); }
</script>
</body>
</html>
