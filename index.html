<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iQC iPhone - iOS 26 Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system, 'SF Pro Display', sans-serif}
body{
  background: radial-gradient(1200px 600px at 70% -10%, #1a5cff 0%, transparent 60%),
              radial-gradient(800px 400px at 20% 100%, #0033a0 0%, transparent 50%),
              #000;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;color:#fff;
}
.iphone-frame{
  width:390px;height:844px;
  background:#000;
  border-radius:54px;
  padding:12px;
  box-shadow:0 0 0 3px #1a1a1a, 0 30px 80px rgba(0,80,255,0.4), 0 0 120px rgba(0,40,255,0.2);
  position:relative;
}
.screen{
  width:100%;height:100%;
  background: linear-gradient(180deg, #0a0f1e 0%, #000 100%);
  border-radius:42px;
  overflow:hidden;
  position:relative;
  display:flex;flex-direction:column;
}
.dynamic-island{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:110px;height:34px;background:#000;border-radius:20px;z-index:10;
}
.status-bar{
  height:54px;display:flex;justify-content:space-between;align-items:center;
  padding:14px 32px 0;font-size:15px;font-weight:600;
}
.content{
  flex:1;padding:20px 20px 30px;
  display:flex;flex-direction:column;gap:16px;
  overflow-y:auto;
}
.title{
  font-size:28px;font-weight:700;letter-spacing:-0.5px;
  background: linear-gradient(90deg, #fff, #5b8def);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.subtitle{color:#7a8aaa;font-size:13px;margin-top:-8px}
.liquid-card{
  background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
  backdrop-filter: blur(40px);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:24px;
  padding:16px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
}
.reaction-bar{
  display:flex;gap:8px;padding:10px 14px;
  background: rgba(40,40,45,0.9);
  backdrop-filter: blur(20px);
  border-radius:32px;
  width:fit-content;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
.reaction-bar span{font-size:28px;cursor:pointer}
.chat-bubble{
  background:#1c1c1e;color:#fff;
  padding:12px 14px;border-radius:18px 18px 4px 18px;
  font-size:15px;max-width:85%;
}
.context-menu{
  background: rgba(40,40,45,0.92);
  backdrop-filter: blur(30px);
  border-radius:18px;
  overflow:hidden;
  margin-top:8px;
}
.menu-item{
  padding:14px 18px;display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(255,255,255,0.08);
  font-size:16px;
}
.menu-item.danger{color:#ff453a}
.upload-area{
  border:1.5px dashed rgba(91,141,239,0.5);
  border-radius:20px;
  padding:28px;text-align:center;
  background: rgba(0,60,255,0.08);
  cursor:pointer;
}
.upload-area input{display:none}
.btn-ios{
  background: linear-gradient(180deg, #0a84ff, #0060df);
  border:none;color:#fff;padding:14px;border-radius:14px;
  font-weight:600;font-size:16px;width:100%;
  box-shadow:0 8px 20px rgba(10,132,255,0.4);
  cursor:pointer;
}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.result-item{background:rgba(255,255,255,0.06);padding:12px;border-radius:14px;text-align:center}
.result-item b{display:block;font-size:18px;color:#5b8def}
.result-item span{font-size:11px;color:#8a9bb5}
.home-indicator{width:134px;height:5px;background:#fff;border-radius:3px;margin:10px auto 0;opacity:0.8}
</style>
</head>
<body>
<div class="iphone-frame">
  <div class="screen">
    <div class="dynamic-island"></div>
    <div class="status-bar"><span>21:36</span><span>📶 🔋 51%</span></div>
    <div class="content">
      <div class="title">iQC iPhone<br>iOS 26</div>
      <div class="subtitle">Image Quality Checker • MuizTzy</div>
      <div class="liquid-card">
        <div class="reaction-bar"><span>👍</span><span>❤️</span><span>😂</span><span>😮</span><span>😢</span><span>🙏</span></div>
        <div style="margin-top:12px">
          <div class="chat-bubble">Di sana pusing pacaran, di sini pusing codingan.<div style="font-size:11px;color:#8a8a8e;text-align:right;margin-top:4px">19:23</div></div>
          <div class="context-menu">
            <div class="menu-item"><span>Beri Bintang</span>⭐</div>
            <div class="menu-item"><span>Balas</span>↩️</div>
            <div class="menu-item"><span>Teruskan</span>↪️</div>
            <div class="menu-item"><span>Salin</span>📄</div>
            <div class="menu-item"><span>Ucapkan</span>💬</div>
            <div class="menu-item"><span>Laporkan</span>⚠️</div>
            <div class="menu-item danger"><span>Hapus</span>🗑️</div>
          </div>
        </div>
      </div>
      <div class="liquid-card">
        <h4 style="margin-bottom:12px">📸 Cek Kualitas Foto iPhone</h4>
        <label class="upload-area" id="drop"><input type="file" id="file" accept="image/*"><div style="font-size:32px"></div><p style="margin-top:8px">Tap untuk upload foto</p><p style="font-size:11px;color:#7a8aaa;margin-top:4px">JPG, PNG, HEIC</p></label>
        <img id="preview" style="width:100%;border-radius:16px;margin-top:12px;display:none">
        <div class="result-grid" id="results" style="display:none"><div class="result-item"><b id="rRes">-</b><span>Resolusi</span></div><div class="result-item"><b id="rSize">-</b><span>Ukuran</span></div><div class="result-item"><b id="rType">-</b><span>Format</span></div><div class="result-item"><b id="rScore">-</b><span>Skor iQC</span></div></div>
        <button class="btn-ios" id="check" style="margin-top:12px;display:none">Analisis ala iOS 26</button>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>
</div>
<script>
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const drop = document.getElementById('drop');
const results = document.getElementById('results');
const checkBtn = document.getElementById('check');
drop.onclick = () => fileInput.click();
fileInput.onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  preview.src = url; preview.style.display = 'block'; drop.style.display = 'none';
  results.style.display = 'grid'; checkBtn.style.display = 'block';
  const img = new Image();
  img.onload = () => {
    document.getElementById('rRes').textContent = img.width + ' x ' + img.height;
    document.getElementById('rSize').textContent = (file.size/1024/1024).toFixed(2) + ' MB';
    document.getElementById('rType').textContent = file.type.split('/')[1].toUpperCase();
    let score = 50; if(img.width>=2000) score+=30; else if(img.width>=1000) score+=15;
    if(file.size>1024*1024) score+=10; document.getElementById('rScore').textContent = Math.min(score,100)+'/100';
  }; img.src = url;
};
checkBtn.onclick = () => { checkBtn.textContent = '✨ Foto ini layak jadi wallpaper iOS 26!'; checkBtn.style.background = 'linear-gradient(180deg,#30d158,#1faa44)'; };
</script>
</body>
</html>
