<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ALL TOOLS MUIZ — IQC & BRAT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#05070b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input,textarea{font:inherit}
.wrap{max-width:520px;margin:auto;min-height:100vh;padding:16px}
h1{font-size:24px;margin:4px 0 5px}.sub{color:#8e9aab;font-size:13px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;border:1px solid #17243b;background:#0a101b;color:#8fa5c4;padding:12px;border-radius:14px;font-weight:700}
.tab.active{background:#0d67ff;color:#fff;border-color:#1680ff}
.card{background:#0a0f18;border:1px solid #16233a;border-radius:18px;padding:14px;margin-bottom:14px}
label{display:block;font-size:12px;color:#8d9bb0;margin:9px 0 6px}
input,textarea{width:100%;border:1px solid #1b2a42;background:#070b12;color:#fff;border-radius:11px;padding:11px;outline:none}
textarea{resize:vertical;min-height:75px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{border:0;border-radius:12px;padding:11px 13px;background:#0d67ff;color:white;font-weight:700;cursor:pointer}
.btn.secondary{background:#121a27;color:#d8e2f2;border:1px solid #22314a}
.btn.danger{background:#39201f;color:#ff765e}
.preview{background:#020305;border-radius:18px;overflow:hidden;border:1px solid #1a2434;position:relative}
#iqcCanvas{display:block;width:100%;height:auto;background:#05070a}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.small{font-size:11px;color:#738198;line-height:1.4}
.hidden{display:none}
.file{padding:9px;background:#070b12;border:1px dashed #263750;border-radius:11px;color:#8fa0b7;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ALL TOOLS MUIZ</h1>
  <div class="sub">IQC iPhone • BRAT Sticker</div>

  <div class="tabs">
    <button class="tab active" id="tabIqc">IQC iPhone</button>
    <button class="tab" id="tabBrat">BRAT Sticker</button>
  </div>

  <section id="iqc">
    <div class="card">
      <div class="row">
        <div><label>Nama</label><input id="name" value="MuizTzy"></div>
        <div><label>Jam</label><input id="time" value="19:23"></div>
      </div>
      <label>Pesan</label>
      <textarea id="msg">Di sana pusing pacaran, di sini pusing codingan.</textarea>
      <label>Foto profil</label>
      <input class="file" id="avatar" type="file" accept="image/*">
      <div class="tools">
        <button class="btn" id="makeIqc">Buat IQC</button>
        <button class="btn secondary" id="downloadIqc">Download PNG</button>
      </div>
      <div class="small" style="margin-top:8px">Hasil dibuat sebagai gambar PNG. Tekan tombol download setelah preview muncul.</div>
    </div>

    <div class="preview"><canvas id="iqcCanvas" width="900" height="1600"></canvas></div>
  </section>

  <section id="brat" class="hidden">
    <div class="card">
      <label>Teks BRAT</label>
      <textarea id="bratText">brat</textarea>
      <div class="row">
        <div><label>Ukuran teks</label><input id="bratSize" type="number" min="20" max="180" value="70"></div>
        <div><label>Rotasi</label><input id="bratRotate" type="number" min="-30" max="30" value="-2"></div>
      </div>
      <label>Warna teks</label>
      <input id="bratColor" type="color" value="#111111">
      <div class="tools">
        <button class="btn" id="makeBrat">Buat BRAT</button>
        <button class="btn secondary" id="downloadBrat">Download PNG</button>
      </div>
    </div>
    <div class="preview"><canvas id="bratCanvas" width="1000" height="1000"></canvas></div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const iqc=$('iqcCanvas'), ictx=iqc.getContext('2d');
let avatarImg=null;

$('avatar').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const img=new Image();
  img.onload=()=>{avatarImg=img;drawIQC()};
  img.src=URL.createObjectURL(f);
});

function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function wrapText(ctx,text,x,y,maxWidth,lineHeight){
  const words=text.split(/\s+/);let line='',lines=[];
  for(const word of words){
    const test=line?line+' '+word:word;
    if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test;
  }
  if(line)lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));
  return lines.length;
}
function drawAvatar(ctx,x,y,size){
  ctx.save();ctx.beginPath();ctx.arc(x+size/2,y+size/2,size/2,0,Math.PI*2);ctx.clip();
  if(avatarImg)ctx.drawImage(avatarImg,x,y,size,size);
  else{ctx.fillStyle='#44515f';ctx.fillRect(x,y,size,size);ctx.fillStyle='#dbe6f2';ctx.font='bold 55px Arial';ctx.textAlign='center';ctx.fillText('M',x+size/2,y+size/2+19)}
  ctx.restore();
}
function drawIQC(){
  const ctx=ictx,W=iqc.width,H=iqc.height;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#05070a';ctx.fillRect(0,0,W,H);

  // status bar
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,86);
  ctx.fillStyle='#fff';ctx.font='bold 29px Arial';ctx.textAlign='left';ctx.fillText($('time').value||'21:36',38,52);
  ctx.font='bold 22px Arial';ctx.fillText('⌁',170,51);ctx.fillText('•••',210,51);
  ctx.textAlign='right';ctx.fillText('▮▮▮  ◉  51',860,52);

  // blurred chat background
  ctx.save();ctx.globalAlpha=.5;
  for(let i=0;i<7;i++){
    ctx.fillStyle=i%2?'#073b3b':'#20252d';
    const x=i%2?500:25,y=150+i*175,w=i%2?330:390,h=105;
    roundRect(ctx,x,y,w,h,28);ctx.fill();
  }
  ctx.restore();

  // top chat bar
  ctx.fillStyle='#090c12';ctx.fillRect(0,86,W,86);
  drawAvatar(ctx,24,101,56);
  ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 25px Arial';ctx.fillText($('name').value||'MuizTzy',94,131);
  ctx.fillStyle='#8f9aa8';ctx.font='17px Arial';ctx.fillText('online',94,154);
  ctx.textAlign='right';ctx.font='30px Arial';ctx.fillText('⌕  ⋮',850,140);

  // message bubble
  const bx=25,by=625,bw=665,bh=150;
  ctx.fillStyle='#263039';roundRect(ctx,bx,by,bw,bh,30);ctx.fill();
  ctx.fillStyle='#f5f7fa';ctx.textAlign='left';ctx.font='29px Arial';
  const lines=wrapText(ctx,$('msg').value||'',bx+25,by+52,bw-90,38);
  ctx.fillStyle='#aeb8c3';ctx.font='18px Arial';ctx.textAlign='right';ctx.fillText($('time').value||'19:23',bx+bw-22,by+bh-20);

  // reaction bar
  const rx=15,ry=465,rw=660,rh=105;
  ctx.fillStyle='#333a42';roundRect(ctx,rx,ry,rw,rh,52);ctx.fill();
  ctx.font='58px "Apple Color Emoji","Segoe UI Emoji",Arial';ctx.textAlign='center';
  ['👍','❤️','😂','😮','😢','🙏'].forEach((e,i)=>ctx.fillText(e,80+i*105,ry+69));

  // context menu
  const mx=18,my=790,mw=640,mh=700;
  ctx.fillStyle='rgba(36,44,50,.97)';roundRect(ctx,mx,my,mw,mh,22);ctx.fill();
  const items=[
    ['Beri Bintang','☆'],['Balas','↶'],['Teruskan','↗'],['Salin','▢'],
    ['Ucapkan','▱'],['Laporkan','△'],['Hapus','▥']
  ];
  const rowH=mh/items.length;
  items.forEach((it,i)=>{
    if(i) {ctx.strokeStyle='#4c555d';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(mx,my+i*rowH);ctx.lineTo(mx+mw,my+i*rowH);ctx.stroke()}
    ctx.textAlign='left';ctx.font='29px Arial';ctx.fillStyle=i===6?'#ff6748':'#f6f7f9';ctx.fillText(it[0],mx+28,my+i*rowH+47);
    ctx.textAlign='center';ctx.font='40px Arial';ctx.fillText(it[1],mx+mw-55,my+i*rowH+49);
  });
}
$('makeIqc').onclick=drawIQC;
$('downloadIqc').onclick=()=>{
  drawIQC();
  const a=document.createElement('a');a.download='IQC-MuizTzy.png';a.href=iqc.toDataURL('image/png');a.click();
};

const bc=$('bratCanvas'),bctx=bc.getContext('2d');
function drawBrat(){
  const W=bc.width,H=bc.height;bctx.clearRect(0,0,W,H);
  bctx.fillStyle='#f4f3ed';bctx.fillRect(0,0,W,H);
  bctx.save();bctx.translate(W/2,H/2);bctx.rotate((+$('bratRotate').value||0)*Math.PI/180);
  bctx.fillStyle=$('bratColor').value;
  bctx.font=`${+$('bratSize').value||70}px Arial`;
  bctx.textAlign='center';bctx.textBaseline='middle';
  const text=$('bratText').value||'brat';
  const max=880; const words=text.split(/\s+/);let lines=[''];
  words.forEach(w=>{
    const test=lines[lines.length-1]?lines[lines.length-1]+' '+w:w;
    if(bctx.measureText(test).width>max&&lines[lines.length-1])lines.push(w);else lines[lines.length-1]=test;
  });
  const lh=(+$('bratSize').value||70)*1.08;
  lines.forEach((l,i)=>bctx.fillText(l,0,(i-(lines.length-1)/2)*lh));
  bctx.restore();
}
$('makeBrat').onclick=drawBrat;
$('downloadBrat').onclick=()=>{drawBrat();const a=document.createElement('a');a.download='BRAT-sticker.png';a.href=bc.toDataURL('image/png');a.click()};

$('tabIqc').onclick=()=>{ $('iqc').classList.remove('hidden');$('brat').classList.add('hidden');$('tabIqc').classList.add('active');$('tabBrat').classList.remove('active')};
$('tabBrat').onclick=()=>{ $('brat').classList.remove('hidden');$('iqc').classList.add('hidden');$('tabBrat').classList.add('active');$('tabIqc').classList.remove('active')};

drawIQC();drawBrat();
</script>
</body>
</html>
