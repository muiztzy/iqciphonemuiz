<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuizTzy - All Tools Nexus Style</title>
<style>
body{background:#0a0a0a;color:white;font-family:sans-serif;margin:0;padding:0;display:flex;justify-content:center}
.hp{width:100%;max-width:400px;min-height:100vh;background:#0a0a0a;padding:0;padding-bottom:180px}
.banner-video{position:relative;width:100%;height:220px;overflow:hidden;border-radius:0 0 24px 24px}
.banner-video video{width:100%;height:100%;object-fit:cover;object-position:center top}
.banner-overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 85%);}
.banner-text{position:absolute;bottom:15px;left:15px;right:15px;z-index:2}
.banner-text h1{color:#ff3b3b;text-shadow:0 0 15px #ff0000;font-size:22px;margin:0;letter-spacing:1px}
.content{padding:15px}
.card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:18px;margin-top:15px}
input{width:100%;background:#111;border:1px solid #333;border-radius:12px;padding:13px;color:white;box-sizing:border-box;margin-bottom:12px}
.btn-buat{width:100%;background:linear-gradient(to bottom, #ff3b3b, #8b0000);border:none;color:white;padding:15px;border-radius:14px;font-weight:bold;box-shadow:0 5px 20px rgba(255,0,0,0.4)}
.player{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:94%;max-width:380px;background:rgba(20,10,10,0.97);border:1px solid #ff3b3b;border-radius:20px;padding:12px;z-index:999}
</style>
</head>
<body>
<div class="hp">
  <!-- INI YANG KAYA CONTOH LU - VIDEO ANIME GEDE DI ATAS -->
  <div class="banner-video">
    <video autoplay loop muted playsinline poster="anime_sasuke.jpg">
      <source src="sasuke_736x414.mp4" type="video/mp4">
      <source src="https://cdn.pixabay.com/video/2020/07/30/45683-444081635_large.mp4" type="video/mp4">
    </video>
    <div class="banner-overlay"></div>
    <div class="banner-text">
      <h1>⚡ All Tools Nexus</h1>
      <div style="font-size:11px;color:#aaa;margin-top:4px">MuizTzy • Tools Builder • Indonesia • Online</div>
    </div>
  </div>

  <div class="content">
    <div class="card">
      <div style="font-size:11px;color:#ff3b3b;font-weight:bold;margin-bottom:8px">🔗 LINK WEBSITE</div>
      <input type="text" id="linkWeb" placeholder="https://tokosaya.com">
      <div style="font-size:11px;color:#ff3b3b;font-weight:bold;margin-bottom:8px">📱 NAMA APK</div>
      <input type="text" id="namaApk" placeholder="Toko Saya">
      <button class="btn-buat" onclick="alert('APK '+ (document.getElementById('namaApk').value||'MyApp') +' dibuat!')">🔨 Buat APK Sekarang</button>
    </div>
  </div>
</div>

<div class="player">
  <audio id="musik" controls style="width:100%;height:36px">
    <source src="https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview116/v4/f2/9e/1d/f29e1d92-f60e-fd34-d1d1-043f45a72fdb/mzaf_4270267093195874145.plus.aac.p.m4a" type="audio/mp4">
  </audio>
</div>
</body>
</html>
